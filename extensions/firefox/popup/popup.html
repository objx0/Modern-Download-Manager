<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Modern Download Manager</title>
 <link rel="stylesheet" href="popup.css">
</head>
<body>
 <header class="brand"><img src="../icons/icon48.png" width="28" height="28" alt=""><div><h1>Modern Download Manager</h1><p>Browser integration</p></div></header>
 <main>
  <section aria-labelledby="captureHeading">
   <h2 id="captureHeading">Download capture</h2>
   <label class="setting" for="autoIntercept"><span>Automatically capture downloads</span><input type="checkbox" id="autoIntercept" aria-describedby="captureHint"></label>
   <p class="hint" id="captureHint">Send browser downloads to the manager for confirmation.</p>
   <div class="divider"></div>
   <label class="setting" for="minimumCaptureSizeMB"><span>Minimum file size</span><span class="size"><input type="number" id="minimumCaptureSizeMB" min="0" step="1" aria-describedby="sizeHint"><span>MB</span></span></label>
   <p class="hint" id="sizeHint">Smaller files stay in the browser. Use 0 for all sizes.</p>
  </section>
  <p class="help">You can also right-click a link and choose <strong>Download with Modern Download Manager</strong>.</p>
 </main>
 <footer><span class="monitoring"><span id="monitoringDot" class="dot" aria-hidden="true"></span><span id="monitoringText">Loading settings...</span></span><span id="status" role="status" aria-live="polite"></span></footer>
 <script src="popup.js"></script>
</body>
</html>
